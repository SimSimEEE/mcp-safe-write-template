# gitleaks config for CI (second-opinion scanner; the primary one is scripts/secret-scan.mjs).
[extend]
useDefault = true

[allowlist]
description = "Public demo keys, generated demo output, and scanner test fixtures"
regexes = [
  '''demo-(reader|support|operator)-key-NOT-A-SECRET''',
  '''sk-pasted-by-mistake''',
  # tests/secret-scan.test.ts: a deliberately secret-looking value that checks the repo scanner
  # reports "suspect" findings. Already in history, so it is allowlisted rather than rewritten.
  '''abcdefgh12345''',
]
